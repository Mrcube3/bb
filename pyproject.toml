[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus-signal-economy"
version = "0.1.0"
description = "PROMETHEUS: a deterministic, auditable market-intelligence marketplace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "pydantic>=2.0,<3",
  "uvicorn[standard]>=0.27,<1",
  "httpx>=0.27,<1",
  "x402>=2.0,<3",
  "eth-account>=0.11,<1",
]

[project.scripts]
prometheus = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*"]
